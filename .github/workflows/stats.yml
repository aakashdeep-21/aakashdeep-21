name: Build stats card

on:
  schedule:
    # 03:00 UTC daily. Pick an off-peak minute; the exact time drifts anyway.
    - cron: "0 3 * * *"
  workflow_dispatch: # lets you trigger it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate-stats.js"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate cards
        env:
          # STATS_TOKEN is a classic PAT with read:user (and repo, if you want
          # private contributions counted). Falls back to the built-in token,
          # which works but only sees public activity.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          THEME=midnight node scripts/generate-stats.js
          THEME=daylight node scripts/generate-stats.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No change in stats today."
          else
            git commit -m "chore: refresh stats card [skip ci]"
            git push
          fi
